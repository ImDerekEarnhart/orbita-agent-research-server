[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbita-agent-research-server"
version = "0.4.0"
description = "MCP-native governed discovery with approval-gated policy improvement and a tenant-scoped Discovery Genome."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Derek Earnhart"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["MCP", "AI agents", "research", "falsification", "epistemic memory", "Lean"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.28,<2",
  "jsonschema>=4.22,<5",
  "fastapi>=0.110,<1",
  "uvicorn>=0.23,<1",
  "pydantic>=2,<3",
  "python-multipart>=0.0.9",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "networkx>=3.2,<4",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  # S3-compatible client, used for Cloudflare R2 archive storage.
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "build>=1.2,<2",
  "ruff>=0.12,<1",
  "pip-audit>=2.9,<3",
]

[project.scripts]
orbita-agent = "orbita_agent.cli:main"
orbita-research-api = "orbita_mvp.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["orbita*", "orbita_discovery*", "orbita_mvp*", "orbita_agent*"]

[tool.setuptools.package-data]
orbita = ["schemas/*.json", "ui_assets/*.html", "ui_assets/*.js", "ui_assets/*.css"]
orbita_mvp = ["static/*.html"]
orbita_agent = ["resources/*.sqlite", "resources/lean/*", "resources/lean/ErdosGyarfas/*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  # Long lines are widespread in frozen schemas, SQL, and research strings;
  # formatting them mechanically would make audit diffs harder to review.
  "E501",
  # FastAPI's File(...) dependency declaration intentionally uses this form.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
# These recursive DFS functions are created and consumed within each loop
# iteration; they are never retained after the loop variable changes.
"src/orbita_agent/eg_lemma_miner.py" = ["B023"]
# This test intentionally verifies that an invalid inherited workspace cannot
# be opened, regardless of the lower-level exception implementation.
"tests/test_workspace_tenancy.py" = ["B017"]
